name: Backend Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker Compose
        run: touch .env

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/caraiva-tours-hub/pom.xml

      - name: Test backend
        working-directory: backend/caraiva-tours-hub
        run: ./mvnw clean verify

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker compose build caraiva-backend

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker compose push caraiva-backend
          docker tag \
            "${DOCKERHUB_USERNAME}/caraiva-tours-backend:${IMAGE_TAG}" \
            "${DOCKERHUB_USERNAME}/caraiva-tours-backend:latest"
          docker push "${DOCKERHUB_USERNAME}/caraiva-tours-backend:latest"

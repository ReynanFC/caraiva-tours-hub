server:
  port: 8080

#Angular
cors:
  originPatterns: http://localhost:4200

app:
  security:
    cookie:
      secure: false

spring:

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.caraivatours.hub: DEBUG
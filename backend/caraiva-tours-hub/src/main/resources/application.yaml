spring:
  application:
    name: caraiva-tours-hub

  profiles:
    active: dev

app:
  security:
    jwt:
      token:
        secret-key: ${JWT_SECRET_KEY}
        expire-length: 3600000
  dashboard:
    sse:
      heartbeat-interval: 60000

spring-doc:
  paths-to-match: /**
  swagger-ui:
    use-root-path: true

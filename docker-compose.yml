services:
  postgres-db:
    image: postgres:16-alpine
    container_name: caraiva-tours-db
    restart: always
    env_file:
      - .env
    networks:
      - caraiva-network
    ports:
      - "5432:5432"
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: caraiva_tours_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d caraiva_tours_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.7-alpine
    container_name: caraiva-tours-redis
    restart: always
    networks:
      - caraiva-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caraiva-backend:
    container_name: caraiva-tours-backend
    restart: always
    build:
      context: ./backend/caraiva-tours-hub/
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caraiva-network

volumes:
  portainer_data:
  postgres_data:
  redis_data:

networks:
  caraiva-network:
    driver: bridge
